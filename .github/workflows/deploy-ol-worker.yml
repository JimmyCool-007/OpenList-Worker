name: Deploy ol Worker to production

on:
  push:
    branches: [deploy/ol-v0.1.0-worker]
    paths: [.github/workflows/deploy-ol-worker.yml]

permissions:
  contents: read

concurrency:
  group: openlist-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check the public CLI endpoint
        run: |
          node --input-type=module -e '
            try {
              const res = await fetch("https://drive.jimmy007.com/api/cli/v1/whoami", { redirect: "manual", signal: AbortSignal.timeout(8000) })
              let cli = false
              if (res.status === 401) {
                const body = await res.json().catch(() => null)
                cli = body?.code === "Unauthorized"
              }
              console.log("Public endpoint HTTP " + res.status + (cli ? " (ol authentication confirmed)" : ""))
            } catch {
              console.log("Public endpoint was unreachable from this run")
            }
          '
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured for this repository"
            missing=1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "::error::Configure CLOUDFLARE_ACCOUNT_ID for the existing production Worker account"
            missing=1
          fi
          exit "$missing"
      - name: Check out the released Worker source
        uses: actions/checkout@v7
        with:
          ref: 5ec3affa19da5a0cc6b6df7baffd43ef63b2a51f
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Validate Worker bundle
        run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --outdir "$RUNNER_TEMP/openlist-dry-run"
      - name: Deploy to the existing openlist-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deployments list --name openlist-worker --config wrangler.jsonc --json > "$RUNNER_TEMP/openlist-previous-deployments.json"
          pnpm exec wrangler deploy --name openlist-worker --config wrangler.jsonc --yes
      - name: Verify CLI authentication at the production hostname
        run: |
          node --input-type=module -e '
            for (let i = 0; i < 10; i++) {
              try {
                const res = await fetch("https://drive.jimmy007.com/api/cli/v1/whoami", { redirect: "manual", signal: AbortSignal.timeout(6000) })
                const body = res.status === 401 ? await res.json().catch(() => null) : null
                if (body?.code === "Unauthorized") {
                  console.log("Production CLI returned the expected HTTP 401 JSON")
                  process.exit(0)
                }
                console.log("Unexpected public endpoint status: " + res.status)
              } catch {
                console.log("Public endpoint could not be reached")
              }
              await new Promise(resolve => setTimeout(resolve, 3000))
            }
            process.exit(1)
          '
