name: OpenList CLI

on:
  pull_request:
    paths:
      - 'cli/**'
      - 'src/backend/**'
      - 'scripts/install-cli.sh'
      - 'scripts/sync-install-cli.mjs'
      - 'scripts/publish-cli-r2.py'
      - 'scripts/test-cli-*'
      - 'wrangler.jsonc'
      - '.github/workflows/cli-release.yml'
  push:
    branches: [main]
    paths: ['cli/VERSION']
    tags: ['ol-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Test and vet
        working-directory: cli
        run: |
          go test -race ./...
          go vet ./...
      - name: Build static Linux binaries
        working-directory: cli
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p ../ol-release
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=$version" -o "../ol-release/ol-linux-$arch" .
            file "../ol-release/ol-linux-$arch"
            if readelf -l "../ol-release/ol-linux-$arch" | grep -q INTERP; then
              exit 1
            fi
          done
          cd ../ol-release
          ./ol-linux-amd64 version | grep -Fx "ol $version"
          sha256sum ol-linux-amd64 ol-linux-arm64 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - run: bash -n scripts/install-cli.sh
      - run: node scripts/sync-install-cli.mjs --check
      - run: bash scripts/test-cli-installer.sh
      - run: python3 scripts/test-cli-publish.py
      - uses: actions/upload-artifact@v4
        with:
          name: ol-linux
          path: ol-release/
          if-no-files-found: error

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Worker auth, task and compatibility tests
        run: |
          pnpm exec tsx --test src/backend/server/install_cli.test.ts src/backend/server/r2_home_widget.test.ts src/backend/server/cli.test.ts src/backend/internal/s3/uploads.test.ts
          pnpm exec tsx --test src/backend/server/webdav_get_sign.test.ts src/backend/server/webdav_propfind.test.ts

  github-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' || startsWith(github.ref, 'refs/tags/ol-v')
    needs: [go, worker]
    runs-on: ubuntu-latest
    concurrency: ol-github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: ol-linux
          path: ol-release
      - name: Publish OpenList CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat cli/VERSION)
          tag="ol-v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag must match cli/VERSION" >&2
            exit 1
          fi
          (cd ol-release && sha256sum --check SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Existing assets are immutable."
            exit 0
          fi
          gh release create "$tag" ol-release/ol-linux-amd64 ol-release/ol-linux-arm64 ol-release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "OpenList CLI $version" --generate-notes --latest=false


  # Verify read and conditional-write permissions without modifying any object.
  r2-preflight:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: r2-maintenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check boto3==1.35.99
      - name: Verify release namespace read and conditional-write access
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          [[ "$CF_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ && -n "$R2_ACCESS_KEY_ID" && -n "$R2_SECRET_ACCESS_KEY" ]] || {
            echo 'Configure CF_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY in r2-maintenance.' >&2
            exit 1
          }
          python scripts/publish-cli-r2.py --preflight

  r2-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' || startsWith(github.ref, 'refs/tags/ol-v')
    needs: [go, worker]
    runs-on: ubuntu-latest
    environment: r2-maintenance
    concurrency: ol-r2-release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ol-linux
          path: ol-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check boto3==1.35.99
      - name: Wait for the deployed Worker and reserved release capacity
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            status=$(curl --connect-timeout 10 --max-time 15 -sS -o /dev/null -w '%{http_code}' https://drive.jimmy007.com/cli-releases/ready || true)
            if [[ "$status" == 204 ]]; then exit 0; fi
            sleep 5
          done
          echo 'Worker release readiness unavailable or 9.5 GB quota has insufficient headroom.' >&2
          exit 1
      - name: Publish and verify immutable assets, then switch latest
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          version=$(cat cli/VERSION)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "ol-v$version" ]]; then
            echo 'Tag must match cli/VERSION' >&2; exit 1
          fi
          python scripts/publish-cli-r2.py "$version" ol-release
      - name: Verify the public installation uses only the custom domain
        run: |
          set -euo pipefail
          curl --retry 6 --retry-all-errors --retry-delay 5 -fsSL https://drive.jimmy007.com/i -o /tmp/install-ol.sh
          cmp scripts/install-cli.sh /tmp/install-ol.sh
          tmp=$(mktemp -d)
          mkdir "$tmp/shim" "$tmp/home"
          cat > "$tmp/shim/curl" <<'SH'
          #!/usr/bin/env bash
          for arg in "$@"; do
            case "$arg" in
              https://drive.jimmy007.com/cli-releases/*) ;;
              https://*|http://*) echo "unexpected installer host: $arg" >&2; exit 1 ;;
            esac
          done
          exec /usr/bin/curl "$@"
          SH
          chmod +x "$tmp/shim/curl"
          HOME="$tmp/home" PATH="$tmp/shim:$PATH" bash /tmp/install-ol.sh
          "$tmp/home/.local/bin/ol" version | grep -Fx "ol $(cat cli/VERSION)"
